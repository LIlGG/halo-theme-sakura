<!DOCTYPE html>
<html
  xmlns:th="https://www.thymeleaf.org"
  lang="zh-CN"
  th:fragment="layout(_title, _header, _content)"
  th:replace="~{layout :: html(head = ~{::theme-head}, content = ~{::theme-content})}"
>
  <title th:fragment="theme-head">
    <th:block th:if="${_title != null}"> <th:block th:replace="${_title}"></th:block> </th:block> <th:block
    th:unless="${_title != null}" th:text="${#strings.isEmpty(site.subtitle) ? site.title : site.title + ' - ' +
    site.subtitle}" ></th:block>
  </title>

  <!--/* 主题页面保留原有页头、正文宽度和文章侧栏 */-->
  <th:block th:fragment="theme-content">
    <!--/* 挂钩，文章 header 等内容 */-->
    <div class="column">
      <!--/* 页面头部，如文章页的随机图？文本？视频？ */-->
      <header class="header" itemscope itemtype="http://schema.org/WPHeader">
        <th:block th:if="${_header != null}">
          <th:block th:replace="${_header}" />
        </th:block>
      </header>
    </div>

    <!--/* 挂钩，不同路由将使用不同的内容进行渲染 */-->
    <div id="content" class="main-inner site-content" th:classappend="${_templateId}">
      <th:block th:replace="${_content}" />
      <!--/* sidebar，侧边栏 */-->
      <th:block th:if="${_sidebar != null}">
        <th:block th:replace="${_sidebar}" />
      </th:block>
    </div>
  </th:block>
</html>
