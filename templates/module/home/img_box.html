<!--/* 首页随机图使用 style 实现，详见 decorate.html*/-->
<figure
  id="centerbg"
  class="centerbg"
  th:fragment="imgbox"
  th:with="hasIdPlaceholder = ${not #strings.isEmpty(theme.config.random_image.rimage_other_params) and #strings.contains(theme.config.random_image.rimage_other_params, '{id}')},
    canChangeBackground = ${theme.config.random_image.rimage_custom_only != true or (hasIdPlaceholder and theme.config.random_image.rimage_cover_back_open and not #strings.isEmpty(theme.config.random_image.rimage_url))}"
>
  <th:block
    th:if="${theme.config.random_image.rimage_cover_back_open and (not #strings.isEmpty(theme.config.random_image.rimage_url))}"
  >
    <th:block th:replace="~{macro/random-image :: image(resourceId='home', resourceType='home', widths='', imageTag=~{::random-background})}">
      <img
        th:fragment="random-background"
        th:src="${imageSrc}"
        th:data-src="${imageDataSrc}"
        th:data-url="${imageUrl + imageFragment}"
        th:data-url-prefix="${imageUrlPrefix}"
        th:data-custom-params="${imageCustomParamsTemplate}"
        th:data-url-fragment="${imageFragment}"
        th:data-append-default-params="${imageAppendDefaultParams}"
        th:data-id-placeholder="${imageHasIdPlaceholder}"
        th:data-currIndex="${imageIndex}"
        class="lazyload cover-bg bg-change-js"
        th:classappend="${imageLowQuality ? 'blur-up' : ''}"
        alt="background picture of the home page"
        width="1920"
        height="1080"
        onerror="imgError(this)"
      />
    </th:block>
    <div class="blend-overlay"></div>
  </th:block>
  <th:block
    th:unless="${theme.config.random_image.rimage_cover_back_open and (not #strings.isEmpty(theme.config.random_image.rimage_url))}"
    th:with="bgImage = ${theme.config.mainScreen.focus_img_1 ?: #theme.assets('/images/default/hd.webp')}"
  >
    <picture>
      <source media="(min-width: 769px)" th:srcset="${bgImage}" />
      <img
        class="cover-bg"
        th:src="${bgImage}"
        th:srcset="|${thumbnail.gen(bgImage, 's')} 400w,
                    ${thumbnail.gen(bgImage, 'm')} 800w,
                    ${thumbnail.gen(bgImage, 'l')} 1200w,
                    ${thumbnail.gen(bgImage, 'xl')} 1600w|"
        sizes="100vw"
        alt="background picture of the home page"
        width="1920"
        height="1080"
      />
    </picture>
  </th:block>

  <div
    class="focusinfo"
    th:with="hitokoto = ${theme.config.mainScreen.hitokoto},
      hitokotoEnabled = ${hitokoto?.enabled == true},
      typewriterEnabled = ${theme.config.mainScreen.focus_info_typewriter == true},
      focusTextPending = ${hitokotoEnabled or typewriterEnabled}"
  >
    <th:block th:replace="~{module/home/focus_tou}"></th:block>
    <div
      class="header-info no-select"
      th:classappend="${#strings.isEmpty(theme.config.mainScreen.focus_info_self_intro) ? 'info-desc' : ''}"
      th:if="${theme.config.mainScreen.focus_info_self_intro or theme.config.mainScreen.focus_info_socials}"
    >
      <p
        class="flex-child-center focus-description"
        th:if="${theme.config.mainScreen.focus_info_self_intro and (hitokotoEnabled or not #strings.isEmpty(theme.config.mainScreen.focus_info_self_intro_text))}"
        th:classappend="${focusTextPending ? 'is-loading' : ''}"
        th:hidden="${not hitokotoEnabled and #strings.isEmpty(theme.config.mainScreen.focus_info_self_intro_text)}"
        th:aria-busy="${focusTextPending}"
        th:data-hitokoto="${hitokotoEnabled}"
        th:data-fallback="${theme.config.mainScreen.focus_info_self_intro_text}"
        th:data-categories="${hitokoto?.categories != null ? #strings.listJoin(hitokoto.categories, ',') : ''}"
        th:data-max-length="${hitokoto?.max_length ?: 30}"
        th:data-typewriter="${typewriterEnabled}"
      >
        <span class="iconify" data-icon="fa:quote-left"></span>
        <span class="desc">
          <span class="focus-text-accessible" th:text="${focusTextPending ? '' : theme.config.mainScreen.focus_info_self_intro_text}"></span>
          <span class="focus-text-value" aria-hidden="true" th:text="${focusTextPending ? '' : theme.config.mainScreen.focus_info_self_intro_text}"></span>
        </span>
        <span class="iconify" data-icon="fa:quote-right"></span>
      </p>
      <div
        class="top-social"
        th:if="${theme.config.mainScreen.focus_info_socials and (not #arrays.isEmpty(theme.config.sns.items))}"
      >
        <ul>
          <li id="bg-prev" th:if="${canChangeBackground}">
            <img class="flipx" th:src="@{/assets/images/next-b.svg}" alt="prev" width="28" height="28" />
          </li>
          <th:block th:replace="~{module/home/top_social}"></th:block>
          <li id="bg-next" th:if="${canChangeBackground}">
            <img th:src="@{/assets/images/next-b.svg}" alt="next" width="28" height="28" />
          </li>
        </ul>
      </div>
    </div>
  </div>
</figure>
